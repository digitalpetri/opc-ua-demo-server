# This file is in "HOCON" format, which is a superset of JSON.

# List of addresses to bind to.
bind-address-list = ["0.0.0.0"]

# Port to bind to.
bind-port = 4840

# List of addresses to create endpoints for.
# Surrounding a hostname or IP address with < and > is special syntax that indicates the address
# should be passed to `HostnameUtil.getHostnames`, which tries to find all hostnames associated
# with an address.
endpoint-address-list = ["<0.0.0.0>", "localhost"]

# A list of hostnames and IP addresses to include in the server certificate when it is created.
# Surrounding a hostname or IP address with < and > is special syntax that indicates the address
# should be passed to `HostnameUtil.getHostnames`, which tries to find all hostnames associated
# with an address.
certificate-hostname-list = ["<0.0.0.0>"]

# List of SecurityPolicy to support.
security-policy-list = [
  "None",
  "Aes128_Sha256_RsaOaep",
  "Basic256Sha256",
  "Aes256_Sha256_RsaPss",
  "RSA_DH_AesGcm",
  "RSA_DH_ChaChaPoly",
  "ECC_nistP256_AesGcm",
  "ECC_nistP256_ChaChaPoly",
  "ECC_nistP384_AesGcm",
  "ECC_nistP384_ChaChaPoly",
  "ECC_brainpoolP256r1_AesGcm",
  "ECC_brainpoolP256r1_ChaChaPoly",
  "ECC_brainpoolP384r1_AesGcm",
  "ECC_brainpoolP384r1_ChaChaPoly",
  "ECC_curve25519_AesGcm",
  "ECC_curve25519_ChaChaPoly",
  "ECC_curve448_AesGcm",
  "ECC_curve448_ChaChaPoly"
]

# List of MessageSecurityMode to support.
security-mode-list = [
  "None",
  "Sign",
  "SignAndEncrypt"
]

# Allow certificates to be managed by a GDS.
gds-push-enabled = true

# Trust all incoming certificates automatically.
# This is not recommended for production systems.
trust-all-certificates = false

# Enable the "Rate Limiting" feature.
rate-limit-enabled = false

# Enable/disable certain parts of the address space or control certain attributes of those
# fragments if enabled.
address-space {
  # A simulated plant exercising the Alarms and Conditions implementation against equipment-shaped
  # models, in an area-based event notifier hierarchy under Demo/Alarms.
  alarms {
    enabled = true

    # Wall-clock interval between simulation ticks. Each tick is one simulated second regardless of
    # this value, so lowering it only makes the scenarios play out faster.
    tick-interval = 1 second
  }
  ctt {
    enabled = true

    # Dedicated no-frills alarm fixtures for focused CTT A&C conformance runs.
    # Disable any other alarm producers while running the focused A&C selections.
    alarms-and-conditions {
      enabled = true

      # Keep the complete eight-state limit trajectory inside the CTT filter capture window.
      dwell-time = 400 milliseconds
    }
  }
  data-type-test.enabled = true
  dynamic.enabled = true
  mass {
    enabled = true
    flat-quantity = 25000
    nested-quantity1 = 100
    nested-quantity2 = 1000
  }
  null.enabled = true
  turtles {
    enabled = true
    depth = 1000000
  }
}

# Role-based Access Control
rbac {
  # These Role-Permission mappings are applied to Nodes in the "SiteA" folder.
  site-a = [
    {
      role-id = "ns=1;s=SiteA_Read"
      permissions = ["Browse", "Read"]
    },
    {
      role-id = "ns=1;s=SiteA_Write"
      permissions = ["Write", "Call"]
    },
    {
      role-id = "ns=1;s=SiteAdmin"
      permissions = ["Browse", "Read", "ReadRolePermissions"]
    }
  ]

  # These Role-Permission mappings are applied to Nodes in the "SiteB" folder.
  site-b = [
    {
      role-id = "ns=1;s=SiteB_Read"
      permissions = ["Browse", "Read"]
    },
    {
      role-id = "ns=1;s=SiteB_Write"
      permissions = ["Write", "Call"]
    },
    {
      role-id = "ns=1;s=SiteAdmin"
      permissions = ["Browse", "Read", "ReadRolePermissions"]
    }
  ]
}

# Server-initiated Reverse Connect targets.
reverse-connect {
  target-list = [
    # {
    #   # Register this target and schedule outbound connection attempts.
    #   enabled = true
    #
    #   # OPC UA client reverse listener the server should dial.
    #   client-listener-url = "opc.tcp://client.example.com:48060"
    #
    #   # Server endpoint advertised in ReverseHello. Must match one of this server's endpoints.
    #   endpoint-url = "opc.tcp://localhost:4840/milo"
    #
    #   # Retry/re-registration interval after failed attempts or closed reverse channels.
    #   registration-period = 15 seconds
    #
    #   # TCP connect timeout for each outbound attempt.
    #   connect-timeout = 5 seconds
    # }
  ]
}
